<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Form definitions</title>
  </head>
  <body>
    <form name="audit-request" method="POST" data-netlify="true" netlify-honeypot="company_website_confirm" hidden>
      <input type="hidden" name="form-name" value="audit-request" />
      <input type="hidden" name="form_type" value="audit" />
      <input type="hidden" name="source" />
      <input type="hidden" name="started_at" />
      <input type="hidden" name="consent_timestamp" />
      <input type="hidden" name="consent_text_version" />
      <label>Leave this field empty <input name="company_website_confirm" type="text" /></label>
      <input name="business_name" type="text" />
      <input name="website_url" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="service_of_interest">
        <option value="Digital presence audits">Digital presence audits</option>
        <option value="Website design and development">Website design and development</option>
        <option value="Website improvements and on-page SEO">Website improvements and on-page SEO</option>
        <option value="Google Business Profile support">Google Business Profile support</option>
        <option value="Content and social media support">Content and social media support</option>
        <option value="Online reputation and review checks">Online reputation and review checks</option>
        <option value="Not sure yet">Not sure yet</option>
        <option value="Something else">Something else</option>
      </select>
      <textarea name="message"></textarea>
      <input name="consent_given" type="checkbox" value="yes" />
    </form>

    <form name="contact-enquiry" method="POST" data-netlify="true" netlify-honeypot="company_website_confirm" hidden>
      <input type="hidden" name="form-name" value="contact-enquiry" />
      <input type="hidden" name="form_type" value="contact" />
      <input type="hidden" name="source" />
      <input type="hidden" name="started_at" />
      <input type="hidden" name="consent_timestamp" />
      <input type="hidden" name="consent_text_version" />
      <label>Leave this field empty <input name="company_website_confirm" type="text" /></label>
      <input name="name" type="text" />
      <input name="business_name" type="text" />
      <input name="website_url" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="service_of_interest">
        <option value="Digital presence audits">Digital presence audits</option>
        <option value="Website design and development">Website design and development</option>
        <option value="Website improvements and on-page SEO">Website improvements and on-page SEO</option>
        <option value="Google Business Profile support">Google Business Profile support</option>
        <option value="Content and social media support">Content and social media support</option>
        <option value="Google Business Profile support">Google Business Profile support</option>
        <option value="Content and social media support">Content and social media support</option>
        <option value="Online reputation and review checks">Online reputation and review checks</option>
        <option value="Not sure yet">Not sure yet</option>
        <option value="Something else">Something else</option>
      </select>
      <textarea name="message"></textarea>
      <input name="consent_given" type="checkbox" value="yes" />
    </form>
  </body>
</html>
